[workspace]
resolver = "3"
members = ["crates/core", "src-tauri", "tools/thumbbench", "tools/parity"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
rayon = "1.12.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Image work is unbearably slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
