[package]
name = "casapic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "CasaPic's photo logic: scanning, index, thumbnails, decoding, edit recipes and rendering"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
windows.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
kamadak-exif = "0.6.1"
walkdir = "2.5.0"
notify = "8.2.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
# multithreaded COM, the same mode the WIC image decoder sets on these threads (the default
# apartment mode panics on a thread WIC already set up)
trash = { version = "5.2.9", default-features = false, features = ["coinit_multithreaded", "chrono"] }

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
